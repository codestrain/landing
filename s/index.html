<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared codestrain report</title>
<meta name="description" content="Anonymized codestrain CLI report — your AI coding strain, distilled.">
<meta property="og:title" content="codestrain — anonymized report">
<meta property="og:description" content="Generated locally, encoded into the URL itself. No server saw this data.">
<meta property="og:image" content="https://codestrain.dev/assets/logo.png">
<meta name="twitter:card" content="summary">
<style>
  :root {
    --bg: #0f0f0f;
    --bg-card: #16213e;
    --fg: #e7ecf3;
    --fg-dim: #8a92a3;
    --accent: #e2b714;
    --green: #4ade80;
    --red: #ef4444;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  header {
    width: 100%;
    max-width: 760px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header a { color: var(--fg-dim); text-decoration: none; }
  header a:hover { color: var(--accent); }
  .brand { color: var(--accent); font-weight: 600; }
  main {
    width: 100%;
    max-width: 760px;
    background: var(--bg-card);
    border: 1px solid #2a3552;
    border-radius: 8px;
    padding: 24px;
    overflow-x: auto;
  }
  pre {
    margin: 0;
    white-space: pre;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--fg);
  }
  /* ANSI SGR → CSS. Matches the palette emitted by codestrain_cli.py
     (see class Colors). Keeps the shared report visually identical to
     what the user saw in their terminal. */
  .ansi-1 { font-weight: 600; }
  .ansi-2 { opacity: 0.55; }
  .ansi-31 { color: var(--red); }
  .ansi-32 { color: var(--green); }
  .ansi-33 { color: var(--accent); }
  .ansi-36 { color: #22d3ee; }
  .ansi-37 { color: var(--fg); }
  .ansi-256-214 { color: var(--accent); }  /* AMBER */
  .actions {
    width: 100%;
    max-width: 760px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .actions a, .actions button {
    background: transparent;
    color: var(--fg-dim);
    border: 1px solid #2a3552;
    border-radius: 6px;
    padding: 8px 14px;
    font-family: var(--font-mono);
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .actions a:hover, .actions button:hover { color: var(--accent); border-color: var(--accent); }
  .err {
    color: var(--red);
    margin: 16px 0;
    padding: 12px;
    border: 1px solid var(--red);
    border-radius: 6px;
    background: rgba(239,68,68,0.05);
  }
  .footer {
    width: 100%;
    max-width: 760px;
    margin-top: 32px;
    color: var(--fg-dim);
    font-size: 12px;
    text-align: center;
  }
  .footer a { color: var(--fg-dim); }
  .footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<header>
  <a href="/"><span class="brand">codestrain</span></a>
  <a href="https://github.com/codestrain/codestrain-cli">GitHub</a>
</header>

<main>
  <pre id="report">Loading…</pre>
  <div id="error" class="err" style="display:none"></div>
</main>

<div class="actions">
  <button id="copy">Copy</button>
  <a id="tweet" href="#" target="_blank" rel="noopener">Share on X</a>
  <a id="hn" href="#" target="_blank" rel="noopener">Submit to HN</a>
  <a href="/">Try it yourself</a>
</div>

<div class="footer">
  This report was generated locally by <a href="https://github.com/codestrain/codestrain-cli">codestrain CLI</a>
  and encoded into the URL. <strong>No server has seen its contents</strong> —
  the data lives only in the link you opened.
</div>

<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const reportEl = $('report');
  const errEl = $('error');

  const showError = (msg) => {
    reportEl.style.display = 'none';
    errEl.style.display = 'block';
    errEl.textContent = msg;
  };

  const params = new URLSearchParams(location.search);
  let d = params.get('d');
  if (!d) {
    showError("No share data found in the URL. Did the link get truncated?");
    return;
  }

  // Tolerant base64-urlsafe decoder.
  // - URLSearchParams.get already decodes percent-escapes.
  // - The encoder strips trailing `=` padding; we restore it.
  // - Truncation in transit (email line-wrap, terminal soft-wrap, chat
  //   shorteners) sometimes drops 1-2 trailing chars. If the encoded
  //   length is 4k+1 (mathematically impossible for valid base64), trim
  //   the trailing char(s) and try again.
  function decodeBase64Urlsafe(raw) {
    let s = raw.replace(/-/g, '+').replace(/_/g, '/').replace(/\s+/g, '');
    // Drop up to 2 trailing chars to coerce length into 4k / 4k+2 / 4k+3.
    for (let drop = 0; drop <= 2; drop++) {
      let candidate = drop === 0 ? s : s.slice(0, -drop);
      while (candidate.length % 4) candidate += '=';
      try {
        const bin = atob(candidate);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return { bytes: out, droppedTail: drop };
      } catch (e) {
        if (drop === 2) throw e;
      }
    }
    throw new Error("unreachable");
  }

  let bytes, droppedTail = 0;
  try {
    const result = decodeBase64Urlsafe(d);
    bytes = result.bytes;
    droppedTail = result.droppedTail;
  } catch (e) {
    showError(
      "Failed to decode the URL. It looks like a few characters were lost in "
      + "transit (chat, email, or terminal soft-wrap can do this). "
      + "Ask the sender to re-run `codestrain --share` and resend the link."
    );
    return;
  }

  if (typeof DecompressionStream === 'undefined') {
    showError("Your browser doesn't support DecompressionStream (gzip). Try a recent Chrome/Safari/Firefox.");
    return;
  }
  let text;
  try {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    text = await new Response(stream).text();
  } catch (e) {
    showError(
      "Decoded the URL, but the report content is corrupted — likely truncated "
      + "in transit. Ask the sender to re-run `codestrain --share` and copy the "
      + "full URL (one continuous line, no breaks)."
    );
    return;
  }

  // Render ANSI SGR escapes as <span> with CSS classes. Supports reset (0),
  // bold (1), dim (2), 8-color foreground (30–37), and 256-color foreground
  // (38;5;N) — that's the full set codestrain_cli.py emits. Anything else is
  // silently dropped, keeping the output clean if the CLI grows new codes.
  function ansiToHtml(input) {
    const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const re = /\x1b\[((?:\d+;)*\d+)m/g;
    let out = '';
    let last = 0;
    let openClasses = [];
    let m;
    const close = () => { if (openClasses.length) { out += '</span>'; openClasses = []; } };
    while ((m = re.exec(input)) !== null) {
      out += esc(input.slice(last, m.index));
      const codes = m[1].split(';').map((n) => parseInt(n, 10));
      close();
      const next = [];
      for (let i = 0; i < codes.length; i++) {
        const code = codes[i];
        if (code === 0) {
          next.length = 0;
        } else if (code === 1 || code === 2) {
          next.push('ansi-' + code);
        } else if (code >= 30 && code <= 37) {
          next.push('ansi-' + code);
        } else if (code === 38 && codes[i + 1] === 5 && Number.isFinite(codes[i + 2])) {
          next.push('ansi-256-' + codes[i + 2]);
          i += 2;
        }
      }
      if (next.length) {
        openClasses = next;
        out += `<span class="${next.join(' ')}">`;
      }
      last = re.lastIndex;
    }
    out += esc(input.slice(last));
    close();
    return out;
  }
  reportEl.innerHTML = ansiToHtml(text);
  if (droppedTail > 0) {
    const note = document.createElement('div');
    note.className = 'err';
    note.style.display = 'block';
    note.style.color = 'var(--accent)';
    note.style.borderColor = 'var(--accent)';
    note.textContent = `Note: ${droppedTail} trailing character(s) were dropped to recover this report — looks like the link was line-wrapped or shortened in transit. Output may be slightly incomplete.`;
    reportEl.parentElement.insertBefore(note, reportEl);
  }

  // Wire actions
  $('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(text);
      $('copy').textContent = 'Copied';
      setTimeout(() => { $('copy').textContent = 'Copy'; }, 1500);
    } catch (e) { /* ignore */ }
  });

  const tweetText = "My codestrain report — anonymized. " + location.href;
  $('tweet').href = "https://x.com/intent/post?text=" + encodeURIComponent(tweetText);

  const hnTitle = "codestrain — your AI coding recovery score from the terminal";
  $('hn').href = "https://news.ycombinator.com/submitlink?u="
    + encodeURIComponent("https://codestrain.dev")
    + "&t=" + encodeURIComponent(hnTitle);
})();
</script>
</body>
</html>
